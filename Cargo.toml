[package]
name = "mx-lab"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "mx_lab"
path = "src/lib.rs"

[[bin]]
name = "mx-lab"
path = "src/app/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
glow = "0.17"
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
rayon = "1.12.0"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Compilation rapide pour itérer, sans sacrifier la vitesse d'analyse
[profile.studio-dev]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true

[build-dependencies]
embed-resource = "3"
zstd = { version = "0.14.3", features = ["zstdmt"] }

[dev-dependencies]
egui_kittest = "0.37.0"
