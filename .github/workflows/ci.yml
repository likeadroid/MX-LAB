# Teste MX-LAB sous macOS et Linux, puis fabrique les paquets autonomes (.app, AppImage) et les
# vérifie sur une machine sans ffmpeg ni mpv. Un tag v* publie une release avec les paquets.
# Windows se vérifie en local : son exe embarque ffmpeg et libmpv, qui ne sont pas dans le dépôt.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv2

      - name: Dépendances (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --profile studio-dev

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg mpv dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Paquet
        run: bash packaging/macos.sh

      - name: Contrôle sans Homebrew
        run: |
          brew uninstall --ignore-dependencies --force mpv ffmpeg
          mkdir check && cd check
          ditto -x -k ../target/package/MX-LAB-macOS.zip .
          MX-LAB.app/Contents/MacOS/mx-lab --self-check
          MX-LAB.app/Contents/MacOS/mx-lab --self-check | grep -q "MX-LAB.app/Contents/MacOS/ffmpeg"

      - uses: actions/upload-artifact@v4
        with:
          name: MX-LAB-macOS
          path: target/package/MX-LAB-macOS.zip

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Paquet
        run: bash packaging/linux.sh

      # Un Ubuntu de bureau sans ffmpeg ni mpv : seules les bibliothèques de base du système
      - name: Contrôle sur un système vierge
        run: |
          docker run --rm -v "$PWD/target/package:/package" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq libgl1 libegl1 libgbm1 libx11-6 libx11-xcb1 libxext6 libxkbcommon0 \
              libwayland-client0 libwayland-egl1 libasound2t64 libfontconfig1 libfreetype6 libharfbuzz0b \
              libfribidi0 libdrm2 > /dev/null
            ! command -v ffmpeg
            cd /tmp && /package/MX-LAB-x86_64.AppImage --appimage-extract > /dev/null
            if ldd squashfs-root/usr/lib/libmpv.so.2 squashfs-root/usr/bin/ffmpeg | grep "not found"; then exit 1; fi
            squashfs-root/AppRun --self-check
            squashfs-root/AppRun --self-check | grep -q "squashfs-root/usr/bin/ffmpeg"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: MX-LAB-Linux
          path: target/package/MX-LAB-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
